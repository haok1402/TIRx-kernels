# FlashMLA SM90 dense MLA decode: the upstream performance sweep (b=128, 128 heads, varlen,
# causal and not, s_q 1/2, s_k 4K-32K) plus DeepSeek-V3 TP-sharded head counts.
kernel: flashmla_sm90_dense_decode
selection_rationale: The defaults span the upstream sweep's short and long contexts, s_q 1 and 2 (MTP), causal, and one TP-sharded head count.
configs:
  - {config: bf16_b128_sq1_sk4096_hq128_hkv1_varlen, default: true}
  - {config: bf16_b128_sq1_sk8192_hq128_hkv1_varlen, default: false}
  - {config: bf16_b128_sq1_sk16384_hq128_hkv1_varlen, default: true}
